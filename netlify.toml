# Static one-page site: no build step, publish the repo root.
[build]
  publish = "."
  command = "echo Static site, no build needed"

# Old Next.js pages now live on the single page.
[[redirects]]
  from = "/portfolio"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
[[redirects]]
  from = "/background"
  to = "/#experience"
  status = 301
